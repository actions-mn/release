name: 'metanorma-release'
description: 'Release compiled Metanorma documents as per-document GitHub Releases'
author: 'actions-mn'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  source-path:
    description: 'Source path containing the metanorma configuration'
    required: false
    default: '.'
  output-dir:
    description: 'Output directory containing compiled documents'
    required: false
    default: '_site'
  release-config:
    description: 'Release manifest file (visibility filter)'
    required: false
    default: 'metanorma.release.yml'
  force:
    description: 'Force release even if content hash matches last release'
    required: false
    default: 'false'
  include-pattern:
    description: 'Glob pattern to filter documents for release (e.g. "cc-*")'
    required: false
    default: '*'
  stages:
    description: 'Comma-separated stages to release (e.g. "published,final-draft"). Empty = all stages.'
    required: false
    default: ''
  default-visibility:
    description: 'Default visibility for documents not listed in release manifest (public or private)'
    required: false
    default: 'public'
  concurrency:
    description: 'Max parallel document processing (1 = sequential)'
    required: false
    default: '4'
  extraction-failure-threshold:
    description: 'Fail if this fraction of RXL files fail extraction (0.0–1.0)'
    required: false
    default: '0.5'
  token:
    description: 'GitHub token for creating releases'
    required: false
    default: '${{ github.token }}'

outputs:
  released-documents:
    description: 'JSON array of released document identifiers'
  skipped-documents:
    description: 'JSON array of skipped document identifiers (unchanged)'
  failed-documents:
    description: 'JSON array of failed document identifiers'
  total-documents:
    description: 'Total number of documents processed'

runs:
  using: 'node24'
  main: 'dist/index.js'
